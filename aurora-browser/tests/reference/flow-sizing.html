<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flow sizing geometry</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; color: #000000; }
  /* No glyph is needed anywhere: every case is a solid rectangle, so text
     shaping and font substitution cannot influence the comparison. */
  body { font-size: 0; }

  /* Each case is its own absolutely positioned cell, so a divergence can be
     attributed to one case by its coordinates. An absolutely positioned box
     establishes a block formatting context, which keeps the cases' margins
     inside their cell. */
  .cell { position: absolute; width: 380px; padding: 10px; background: #eeeeee; }

  /* 1. Two adjacent block siblings: their vertical margins collapse to the
     larger of the two (30px), not to their sum (50px). The first child's 10px
     top margin stays inside the cell instead of collapsing out of it. */
  .c1 { left: 20px; top: 20px; }
  .c1 .m1 { margin: 10px 0 20px; height: 20px; background: #b00000; }
  .c1 .m2 { margin: 30px 0 10px; height: 20px; background: #0044bb; }

  /* 2. A percentage width resolves against the containing block's CONTENT box:
     50% of (300 - 2*20) = 130px, not 150. */
  .c2 { left: 460px; top: 20px; }
  .c2 .pad { width: 300px; padding: 0 20px; }
  .c2 .half { width: 50%; height: 20px; background: #008800; }

  /* 3. min-width and max-width clamp the used width: 100px clamps up to 160px
     and 300px clamps down to 120px. */
  .c3 { left: 900px; top: 20px; }
  .c3 .mn { width: 100px; min-width: 160px; height: 20px; background: #aa00aa; }
  .c3 .mx { width: 300px; max-width: 120px; height: 20px; background: #ffaa00; margin-top: 10px; }

  /* 4. A shrink-to-fit inline-block takes the width of its widest content
     (80px and 60px) and the second one sits beside it on the same line. */
  .c4 { left: 20px; top: 240px; }
  .c4 .ib { display: inline-block; background: #00aaaa; }
  .c4 .ib > i { display: block; width: 80px; height: 20px; }
  .c4 .ib2 { display: inline-block; background: #aa6600; }
  .c4 .ib2 > i { display: block; width: 60px; height: 20px; }

  /* 5. Two left floats share one line, and a clear:left block starts below the
     taller float (60px), not below the shorter one. */
  .c5 { left: 460px; top: 240px; }
  .c5 .f1 { float: left; width: 100px; height: 60px; background: #0066cc; }
  .c5 .f2 { float: left; width: 80px; height: 30px; background: #cc6600; }
  .c5 .cl { clear: left; height: 20px; background: #333333; }

  /* 6. A fixed table layout gives 25%/75% of the 300px table width to one
     column each. */
  .c6 { left: 900px; top: 240px; }
  .c6 table { table-layout: fixed; width: 300px; border-collapse: collapse; }
  .c6 td { padding: 0; height: 20px; }
  .c6 .t1 { width: 25%; background: #990099; }
  .c6 .t2 { background: #009999; }
</style>
</head>
<body>
  <div class="cell c1"><div class="m1"></div><div class="m2"></div></div>
  <div class="cell c2"><div class="pad"><div class="half"></div></div></div>
  <div class="cell c3"><div class="mn"></div><div class="mx"></div></div>
  <div class="cell c4"><span class="ib"><i></i></span><span class="ib2"><i></i></span></div>
  <div class="cell c5"><div class="f1"></div><div class="f2"></div><div class="cl"></div></div>
  <div class="cell c6"><table><tr><td class="t1"></td><td class="t2"></td></tr></table></div>
</body>
</html>
