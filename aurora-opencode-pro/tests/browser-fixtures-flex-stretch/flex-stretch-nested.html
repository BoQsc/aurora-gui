<!doctype html>
<style>
html,body{margin:0;background:#ffffff}
/* A stretched item re-lays out its subtree: a percentage-height child fills the
   stretched content box (CSS Flexbox 8.3; CSS 10.5 percentage heights). */
.row{display:flex;height:60px;width:100px;background:#eeeeee}
.n{width:50px;background:#2266cc}
.inner{height:100%;width:50%;background:#cc2244}
</style>
<div class="row"><div class="n"><div class="inner"></div></div></div>
