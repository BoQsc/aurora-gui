<!doctype html><meta charset="utf-8"><title>Float formatting context reference</title>
<style>
html,body{margin:0;background:white}
/* A block formatting context root (overflow:hidden) whose auto height must
   contain the floats inside it (CSS 2.1 10.6.7). */
.bfc{overflow:hidden;width:250px;background:#eef}
/* The first float lives in a child that is NOT a formatting context root, so
   it belongs to .bfc's context (CSS 9.4.1) and must stay active for the
   following siblings: the second float is placed beside it, not over it. Both
   rects are pure box geometry - no text, so no font metric can influence the
   comparison. */
.plain{display:block}
.f1{float:left;width:80px;height:60px;background:#cc2244}
.f2{float:left;width:120px;height:30px;background:#2a8a3a}
</style><div class="bfc"><div class="plain"><div class="f1"></div></div><div class="f2"></div></div><div style="height:20px;background:#111"></div>
