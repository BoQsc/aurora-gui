<!doctype html><meta charset="utf-8"><title>Box shadow reference</title>
<style>
html,body{margin:0;background:white}
/* A zero-blur, zero-spread shadow offset by 10px is a solid rectangle 10px
   right and down of the box, painted behind it: no blur radius means no
   interpolation and no dependence on any metric. */
.s{width:60px;height:40px;background:#2266cc;box-shadow:10px 10px 0 0 #000}
.after{width:60px;height:20px;background:#2a8a3a}
</style><div class="s"></div><div class="after"></div>
