<!doctype html><meta charset="utf-8"><title>align-content reference</title>
<style>
html,body{margin:0;background:white}
/* A wrapping row 100px tall holding two 20px lines leaves 60px of cross space:
   align-content: space-between puts line 1 at the top and line 2 at the bottom
   (CSS Flexbox 8.5). */
.row{display:flex;flex-wrap:wrap;align-content:space-between;width:250px;height:100px;background:#eef}
.a{width:100px;height:20px;background:#2266cc}
.b{width:100px;height:20px;background:#2a8a3a}
.c{width:100px;height:20px;background:#cc2244}
</style><div class="row"><div class="a"></div><div class="b"></div><div class="c"></div></div>
