<!doctype html>
<style>
html,body{margin:0;background:#ffffff}
/* Lines of different natural height share the left-over cross space equally;
   a definite-height item keeps its height while an auto item grows. */
.wrap{display:flex;flex-wrap:wrap;height:100px;width:100px}
.a{width:50px;height:20px;background:#2266cc}
.c{width:50px;background:#22aa44}
.b{width:60px;height:30px;background:#cc2244}
</style>
<div class="wrap"><div class="a"></div><div class="c"></div><div class="b"></div></div>
