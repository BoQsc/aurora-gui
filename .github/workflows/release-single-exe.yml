name: Release single-exe binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.60.0)'
        required: true

permissions:
  contents: write

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            pkg-config-mingw-w64-x86-64 nasm make cmake wget git
          python3 -m pip install --user --break-system-packages meson ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build minimal static ffmpeg/ffprobe
        run: bash scripts/build-minimal-ffmpeg-win64.sh

      - name: Upload minimal ffmpeg
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-minimal-win64
          path: |
            build/ffmpeg-minimal/dist/bin/ffmpeg.exe
            build/ffmpeg-minimal/dist/bin/ffprobe.exe
          if-no-files-found: error
          retention-days: 1

  build-exes:
    needs: build-ffmpeg
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install DMD and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-2.112.0

      - name: Enforce single-source version policy
        run: python -X utf8 scripts/version.py check

      - name: Download minimal ffmpeg
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-minimal-win64
          path: ${{ runner.temp }}/ffmpeg-minimal-win64

      - name: Stage embedded ffmpeg for single-exe builds
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "ffmpeg-minimal-win64"
          foreach ($embedded in @("aurora-stream\embedded", "embedded")) {
            New-Item -ItemType Directory -Force -Path $embedded | Out-Null
            Copy-Item (Join-Path $src "ffmpeg.exe") (Join-Path $embedded "ffmpeg.exe") -Force
            Copy-Item (Join-Path $src "ffprobe.exe") (Join-Path $embedded "ffprobe.exe") -Force
          }

      - name: Build and verify portable executables
        run: python -X utf8 scripts/build-portable-windows.py --compiler dmd --single-exe

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            aurora-cut.exe
            aurora-stream/aurora-stream.exe
            aurora-image-viewer/aurora-image-viewer.exe
            aurora-opencode/aurora-opencode.exe
            aurora-opencode-pro/aurora-opencode-pro.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
