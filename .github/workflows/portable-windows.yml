name: Build & publish portable executables
run-name: Build & publish portable executables (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - .github/workflows/portable-windows.yml
      - .github/workflows/minimal-ffmpeg.yml
      - scripts/build-portable-windows.py
      - scripts/build-minimal-ffmpeg-win64.sh
      - scripts/verify-windows-portability.py
      - scripts/verify-windows-gui-subsystem.py
      - scripts/version.py
      - source/**
      - '!source/**/appversion.d'
      - aurora-stream/source/**
      - '!aurora-stream/source/**/appversion.d'
      - aurora-stream/tests/verify_gfxcapture_runtime.py

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install DMD and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-2.112.0

      - name: Enforce Windows GUI-subsystem policy
        run: python -X utf8 scripts/verify-windows-gui-subsystem.py

      - name: Enforce single-source version policy
        run: python -X utf8 scripts/version.py check

      - name: Download minimal ffmpeg artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow minimal-ffmpeg.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')"
          echo "using minimal-ffmpeg run $run_id"
          gh run download "$run_id" --repo "${{ github.repository }}" \
            --name ffmpeg-minimal-win64 --dir "$RUNNER_TEMP/ffmpeg"
          ls -R "$RUNNER_TEMP/ffmpeg"

      - name: Stage embedded ffmpeg for single-exe builds
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Get-ChildItem -Path $root -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          $ffmpegExe = Get-ChildItem -Path $root -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $root -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) {
            Write-Error "ffmpeg.exe/ffprobe.exe not found under $root"
            exit 1
          }
          # aurora-cut lives at the repo root, so its embedded/ is "embedded";
          # aurora-stream keeps its own embedded/ folder.
          foreach ($embedded in @("aurora-stream\embedded", "embedded")) {
            New-Item -ItemType Directory -Force -Path $embedded | Out-Null
            Copy-Item $ffmpegExe.FullName (Join-Path $embedded "ffmpeg.exe") -Force
            Copy-Item $ffprobeExe.FullName (Join-Path $embedded "ffprobe.exe") -Force
            Get-ChildItem $embedded | Select-Object FullName, Length | Format-Table -AutoSize
          }

      - name: Verify Windows Graphics Capture runtime
        run: python -X utf8 aurora-stream/tests/verify_gfxcapture_runtime.py --allow-no-d3d11 --ffmpeg aurora-stream/embedded/ffmpeg.exe

      - name: Build and verify portable executables
        run: python -X utf8 scripts/build-portable-windows.py --compiler dmd --single-exe

      - name: Upload portable executables (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: aurora-windows-portable
          path: |
            aurora-cut.exe
            aurora-image-viewer/aurora-image-viewer.exe
            aurora-opencode/aurora-opencode.exe
            aurora-opencode-pro/aurora-opencode-pro.exe
            aurora-stream/aurora-stream.exe
          if-no-files-found: error
          retention-days: 14

      - name: Rename release assets with version (avoids Explorer icon cache)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION.txt | Select-Object -First 1).Trim()
          Copy-Item aurora-cut.exe "aurora-cut-v$v.exe" -Force
          Copy-Item aurora-stream/aurora-stream.exe "aurora-stream-v$v.exe" -Force
          Copy-Item aurora-image-viewer/aurora-image-viewer.exe "aurora-image-viewer-v$v.exe" -Force
          Copy-Item aurora-opencode/aurora-opencode.exe "aurora-opencode-v$v.exe" -Force
          Copy-Item aurora-opencode-pro/aurora-opencode-pro.exe "aurora-opencode-pro-v$v.exe" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            aurora-cut-v*.exe
            aurora-stream-v*.exe
            aurora-image-viewer-v*.exe
            aurora-opencode-v*.exe
            aurora-opencode-pro-v*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
