name: Build minimal shared libav (Windows x64)

# Deliberately separate from minimal-ffmpeg.yml and NOT on the release critical
# path: a failure here can never block a portable/release build. This produces
# the small optional `libav/` download that powers aurora-cut's in-process scrub
# decoder (source/auroracut/libavdecode.d). See
# scripts/build-minimal-ffmpeg-libav-win64.sh.

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-minimal-ffmpeg-libav-win64.sh
      - .github/workflows/minimal-libav-ffmpeg.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            pkg-config-mingw-w64-x86-64 nasm make wget git wine wine64
          python3 -m pip install --user --break-system-packages meson ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build minimal shared libav
        run: bash scripts/build-minimal-ffmpeg-libav-win64.sh

      - name: Upload minimal shared libav
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-minimal-libav-win64
          path: |
            build/ffmpeg-minimal-libav/dist/bin/*.dll
          if-no-files-found: error
          retention-days: 14
