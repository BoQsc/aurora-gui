name: Build 0BSD portable runtime backend

on:
  workflow_dispatch:
  push:
    branches:
      - codex/portable-crt-experiment
    paths:
      - experiments/portablecrt/**
      - .github/workflows/portablecrt.yml

permissions:
  contents: read

jobs:
  windows-ucrt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Build 0BSD Windows UCRT backend
        run: python experiments/portablecrt/build.py
      - name: Upload library and license
        uses: actions/upload-artifact@v7
        with:
          name: portablecrt-windows-ucrt
          path: |
            experiments/portablecrt/portablecrt.lib
            experiments/portablecrt/LICENSE
            experiments/portablecrt/README.md
          if-no-files-found: error
          retention-days: 14
