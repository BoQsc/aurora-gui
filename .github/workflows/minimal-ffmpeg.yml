name: Build minimal ffmpeg (Windows x64)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-minimal-ffmpeg-win64.sh
      - .github/workflows/minimal-ffmpeg.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            pkg-config-mingw-w64-x86-64 nasm make cmake wget git wine wine64
          python3 -m pip install --user --break-system-packages meson ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build minimal static ffmpeg/ffprobe
        run: bash scripts/build-minimal-ffmpeg-win64.sh

      - name: Verify encoder/decoder/filter inventory
        run: |
          export WINEDEBUG=-all
          if command -v wine64 >/dev/null 2>&1; then WINE=wine64; else WINE=wine; fi
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -version
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -encoders
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -decoders
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -filters
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -protocols
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -devices
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -filters | grep -E 'ddagrab|gfxcapture|hwdownload'
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -h filter=gfxcapture | grep -E 'pre-existing HWND handle|display yellow border'
          "$WINE" build/ffmpeg-minimal/dist/bin/ffmpeg.exe -hide_banner -devices | grep -E 'gdigrab|dshow|lavfi'

      - name: Upload minimal ffmpeg
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-minimal-win64
          path: |
            build/ffmpeg-minimal/dist/bin/ffmpeg.exe
            build/ffmpeg-minimal/dist/bin/ffprobe.exe
          if-no-files-found: error
          retention-days: 14

  windows-runtime:
    name: Verify Windows Graphics Capture runtime
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download the exact build artifact
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-minimal-win64
          path: build/wgc-runtime/ffmpeg

      - name: Capture a background HWND without activation
        run: python -X utf8 aurora-stream/tests/verify_gfxcapture_runtime.py --ffmpeg build/wgc-runtime/ffmpeg/ffmpeg.exe
